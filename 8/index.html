<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Задание 8 - Форма обратной связи</title>
    <link rel="stylesheet" href="style.css">
    <script src="feedback.js" defer></script>
</head>
<body>

    <header class="site-header">
        <div class="container header-inner">
            <div class="header-brand">
                <img src="image.jpg" alt="Логотип сайта" class="logo">
                <span class="site-title">KOVALEV SITE</span>
            </div>
            <nav class="site-nav">
                <ul>
                    <li><a href="index.html">Задание 8</a></li>
                    <li><a href="../7/">Задание 7</a></li>
                    <li><a href="../6/">Задание 6</a></li>
                    <li><a href="../5/">Задание 5</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container main-content">
        <section class="intro-card">
            <h1>Обратная связь</h1>
            <p class="description">
                Нажмите на кнопку ниже, чтобы открыть контактную форму.
                Введённые данные автоматически сохраняются в браузере,
                а при открытии формы обновляется адрес страницы (History API).
            </p>
            <button type="button" id="open-modal-btn" class="primary-btn">
                Открыть форму обратной связи
            </button>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>(c) Ковалев Иван</p>
        </div>
    </footer>

    <div
        id="feedback-modal"
        class="modal-overlay"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modal-title"
        aria-hidden="true"
    >
        <div class="modal-window">
            <div class="modal-header">
                <h2 id="modal-title">Связаться с нами</h2>
                <button
                    type="button"
                    id="close-modal-btn"
                    class="close-btn"
                    aria-label="Закрыть окно"
                >&times;</button>
            </div>

            <form id="feedback-form" class="feedback-form">
                <div class="form-group">
                    <label for="fullname">ФИО *</label>
                    <input
                        type="text"
                        id="fullname"
                        name="fullname"
                        placeholder="Иванов Иван Иванович"
                        required
                    >
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="email">Email *</label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="example@mail.ru"
                            required
                        >
                    </div>
                    <div class="form-group">
                        <label for="phone">Телефон *</label>
                        <input
                            type="tel"
                            id="phone"
                            name="phone"
                            placeholder="+7 (999) 123-45-67"
                            required
                        >
                    </div>
                </div>

                <div class="form-group">
                    <label for="organization">Организация</label>
                    <input
                        type="text"
                        id="organization"
                        name="organization"
                        placeholder="КубГУ"
                    >
                </div>

                <div class="form-group">
                    <label for="message">Сообщение *</label>
                    <textarea
                        id="message"
                        name="message"
                        rows="3"
                        placeholder="Введите ваше сообщение..."
                        required
                    ></textarea>
                </div>

                <div class="form-group checkbox-group">
                    <input type="checkbox" id="consent" name="consent" required>
                    <label for="consent">
                        Я согласен с политикой обработки персональных данных *
                    </label>
                </div>

                <div
                    id="form-status"
                    class="form-status"
                    aria-live="polite"
                ></div>

                <button type="submit" id="submit-btn" class="submit-btn">
                    Отправить
                </button>
            </form>
        </div>
    </div>

</body>
</html>
